name: CI/CD - Agente Snorkel Docker Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia o codigo
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # 2. Autentica no Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Faz o build e envia a nova imagem (CI)
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: anteromath123/agente-snorkel:latest

      # 4. Acessa a OCI via SSH e atualiza o container (CD)
      - name: Deploy na Instancia OCI
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
              sudo docker stop agente-snorkel || true
              sudo docker rm agente-snorkel || true
              
              # Garante que os arquivos físicos existam no servidor da Oracle antes de mapear
              touch ~/feedbacks_log.json
              touch ~/historico.db
              
              # Baixa a nova versão do código
              sudo docker pull anteromath123/agente-snorkel:latest
              
              # Roda o contêiner com as pontes (Volumes) para o servidor
              sudo docker run -d --name agente-snorkel -p 8501:8501 \
                -v ~/.oci:/root/.oci \
                -v ~/chroma_db:/app/chroma_db \
                -v ~/feedbacks_log.json:/app/feedbacks_log.json \
                -v ~/historico.db:/app/historico.db \
                -v ~/feedbacks_log.json:/app/src/feedbacks_log.json \
                -v ~/historico.db:/app/src/historico.db \
                anteromath123/agente-snorkel:latest

              # Opcional: Se você usa o sincronizador/ingestão no deploy, mantenha aqui
              sleep 5
              sudo docker exec agente-snorkel python src/sincronizador.py || true
              sudo docker exec agente-snorkel python src/ingestion.py || true
              sudo docker restart agente-snorkel