name: CI/CD - Agente Snorkel Docker Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia o seu código
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Autentica no Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Faz o build e envia a nova imagem (CI)
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: anteromath123/agente-snorkel:latest

      # 4. Acessa a OCI via SSH e atualiza o container (CD) - Método Nativo
      - name: Configurar Chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Deploy na Instância OCI
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }} << 'EOF'
            # Baixa a imagem mais recente
            docker pull anteromath123/agente-snorkel:latest
            
            # Para e remove o container antigo (se existir)
            docker stop agente-snorkel || true
            docker rm agente-snorkel || true
            
            # Sobe o novo container em segundo plano (-d) com o volume do OCI
            docker run -d --name agente-snorkel -p 8501:8501 -v ~/.oci:/root/.oci anteromath123/agente-snorkel:latest
          EOF