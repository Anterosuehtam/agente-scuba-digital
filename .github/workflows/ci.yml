name: CI/CD - Agente Snorkel Docker Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia o codigo
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # 2. Autentica no Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Faz o build e envia a nova imagem (CI)
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: anteromath123/agente-snorkel:latest

      # 4. Acessa a OCI via SSH e atualiza o container (CD)
      - name: Deploy na Instancia OCI
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # Baixa a imagem mais recente
            sudo docker pull anteromath123/agente-snorkel:latest
            
            # Para e remove o container antigo (se existir)
            sudo docker stop agente-snorkel || true
            sudo docker rm agente-snorkel || true
            
            # Sobe o novo container em segundo plano (-d) com o volume do OCI
            sudo docker run -d --name agente-snorkel -p 8501:8501 -v ~/.oci:/root/.oci anteromath123/agente-snorkel:latest